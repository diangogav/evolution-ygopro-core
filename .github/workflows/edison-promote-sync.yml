name: Edison fork — promote sync

# A "sync PR" (opened by edison-upstream-watch.yml, upstream-sync -> edison) is
# a REBASED HISTORY of the edison feature stack, not an ordinary feature PR: it
# carries the same commits edison already has, replayed on top of a newer
# upstream tip, plus one re-pin commit. No GitHub merge button can apply it
# correctly. "Merge" adds a merge commit and edison stops being a clean rebased
# stack. "Rebase and merge" replays every commit on the PR — including
# upstream's own commits — on top of edison, duplicating history that is
# already there. And because both sides can touch the same re-pinned lines
# (EXPECTED_SHA in tools/build-edison.sh, the base column in EDISON-FORK.md),
# the PR can even show as conflicting to GitHub's merge check.
#
# The only correct way to take a sync is to replace edison with upstream-sync
# wholesale (a force-with-lease push) and tag the result. Running this
# workflow — after reading the sync PR's ABI verdict — IS the human gate that
# used to be "click merge". There is nothing left to click on the PR itself;
# it exists for review, and this workflow closes it once promoted.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Sync PR number to promote. Leave empty to auto-discover the single open upstream-sync -> edison PR."
        required: false
        type: string

# gh, run inside a fork, resolves the PARENT repository (purerosefallen/
# ygopro-core) as its default for pr, issue, release and workflow commands.
# GH_REPO pins every gh call to this repository.
env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the sync token secret is configured
        env:
          HAS_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::UPSTREAM_SYNC_TOKEN is not set. Promoting a sync force-pushes edison and pushes a release tag; only a PAT push (not GITHUB_TOKEN) raises the push event that triggers edison-build.yml on the new edison head and on the tag. Create the UPSTREAM_SYNC_TOKEN secret (see EDISON-FORK.md), then re-run this workflow. Nothing has been pushed, tagged, or closed." >&2
            exit 1
          fi

      - name: Checkout edison
        uses: actions/checkout@v6
        with:
          ref: edison
          fetch-depth: 0
          fetch-tags: true
          # The push steps below need the PAT: only a PAT-authored push
          # raises the push event edison-build.yml listens for. The first
          # step already failed if it is unset, so there is no fallback.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Resolve the sync PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_PR" ]; then
            json="$(gh pr view "$INPUT_PR" --json number,headRefOid,title,baseRefName,headRefName)"
            base="$(jq -r '.baseRefName' <<<"$json")"
            head="$(jq -r '.headRefName' <<<"$json")"
            if [ "$base" != "edison" ] || [ "$head" != "upstream-sync" ]; then
              echo "::error::PR #${INPUT_PR} has base '${base}' and head '${head}'; a promotable sync PR must have base 'edison' and head 'upstream-sync'." >&2
              exit 1
            fi
          else
            list="$(gh pr list --state open --base edison --head upstream-sync --json number,headRefOid,title)"
            count="$(jq 'length' <<<"$list")"
            if [ "$count" -ne 1 ]; then
              echo "::error::found ${count} open PR(s) with base 'edison' and head 'upstream-sync'; expected exactly one. Pass the 'pr' input to pick one explicitly." >&2
              exit 1
            fi
            json="$(jq '.[0]' <<<"$list")"
          fi

          number="$(jq -r '.number' <<<"$json")"
          head_sha="$(jq -r '.headRefOid' <<<"$json")"
          title="$(jq -r '.title' <<<"$json")"
          old_edison="$(git rev-parse origin/edison)"

          # The PR must be exactly what the watch workflow published: not a
          # stale view of a branch that moved since, and not a hand-pushed
          # branch pretending to be a sync.
          git fetch --quiet origin upstream-sync
          published_sha="$(git rev-parse origin/upstream-sync)"
          if [ "$published_sha" != "$head_sha" ]; then
            echo "::error::origin/upstream-sync is at ${published_sha}, but PR #${number} is at ${head_sha}. The branch moved since the PR was opened or last refreshed — re-run edison-upstream-watch.yml to refresh it, then re-run this workflow." >&2
            exit 1
          fi

          # The sync must really sit on the current upstream tip. If upstream
          # moved again after the sync branch was published, promoting now
          # would ship a stale rebase.
          git remote add upstream https://github.com/purerosefallen/ygopro-core.git || true
          git fetch --quiet upstream master
          if ! git merge-base --is-ancestor upstream/master origin/upstream-sync; then
            echo "::error::upstream/master is not an ancestor of origin/upstream-sync — upstream moved again since this sync was published. Re-run edison-upstream-watch.yml to refresh the sync branch, then re-run this workflow." >&2
            exit 1
          fi

          subject="$(git log -1 --format=%s "$head_sha")"
          if ! [[ "$subject" =~ ^chore\(edison\):\ rebase\ onto\ upstream\ ([0-9a-f]+)\ and\ re-pin\ reproducible\ sha$ ]]; then
            echo "::error::the tip commit of upstream-sync ('${subject}') does not match the re-pin commit subject edison-upstream-watch.yml produces. Refusing to promote a branch that was not published by that workflow." >&2
            exit 1
          fi
          upstream_short="${BASH_REMATCH[1]}"

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "old_edison=$old_edison" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$upstream_short" >> "$GITHUB_OUTPUT"
          {
            echo "title<<PR_TITLE_EOF"
            echo "$title"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute the next release tag
        id: version
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*-edison' --sort=-v:refname | head -1)"
          # shellcheck disable=SC1091
          source tools/edison-release-lib.sh

          # A re-run after a partial failure (edison pushed and tagged, but the
          # PR not closed) sees the tag from that earlier run as `latest`. When
          # it already points at the commit being promoted, that tag IS this
          # promotion's release: reuse it and skip the tag push, instead of
          # minting the next version on the same commit. Otherwise bump, and
          # refuse to touch a tag that already exists for any other reason.
          already_tagged=false
          if [ -n "$latest" ] && [ "$(git rev-parse "refs/tags/${latest}^{commit}")" = "$HEAD_SHA" ]; then
            next="$latest"
            already_tagged=true
            echo "tag ${latest} already points at ${HEAD_SHA}; a previous run tagged it, continuing."
          else
            next="$(next_edison_tag "$latest")"
            if git rev-parse -q --verify "refs/tags/${next}" >/dev/null 2>&1; then
              echo "::error::tag ${next} already exists and does not point at the commit being promoted — refusing to move it. Delete or advance the stale tag by hand first, then re-run this workflow." >&2
              exit 1
            fi
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "already_tagged=$already_tagged" >> "$GITHUB_OUTPUT"

      - name: Promote upstream-sync to edison
        id: promote
        env:
          OLD_EDISON: ${{ steps.resolve.outputs.old_edison }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$OLD_EDISON" = "$HEAD_SHA" ]; then
            echo "edison is already at ${HEAD_SHA}; a previous run promoted it, continuing."
            exit 0
          fi
          # force-with-lease refuses if edison moved since old_edison was
          # read above, instead of blindly overwriting someone else's push.
          # Pushed with the PAT (checked out above), this raises the push
          # event that starts edison-build.yml's sha-assert build on the new
          # edison head.
          git push --force-with-lease="refs/heads/edison:${OLD_EDISON}" origin origin/upstream-sync:refs/heads/edison

      - name: Tag and publish the release
        id: tag
        if: steps.version.outputs.already_tagged != 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          UPSTREAM_SHORT: ${{ steps.resolve.outputs.upstream_short }}
        run: |
          set -euo pipefail
          git config user.name "edison-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git tag -a "$NEXT" -m "Edison release ${NEXT} — rebased onto upstream ${UPSTREAM_SHORT}." "$HEAD_SHA"

          # A tag pushed with the PAT triggers edison-build.yml's
          # `on.push.tags` trigger directly, which publishes the release
          # asset and opens the consumer pin PRs. No explicit dispatch is
          # needed or wanted — a dispatch on top of this push would build the
          # same tag twice.
          git push origin "refs/tags/${NEXT}"

      - name: Close the PR
        id: close
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          OLD_EDISON: ${{ steps.resolve.outputs.old_edison }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          body="$(printf 'Promoted: `edison` is now at `%s` (was `%s`), tagged `%s`. The tag build publishes the release and opens the consumer pin PRs.\n' \
            "$HEAD_SHA" "$OLD_EDISON" "$NEXT")"
          gh pr comment "$PR_NUMBER" --body "$body"

          # Once edison points at the PR's head, GitHub marks the PR merged on
          # its own, and `gh pr close` refuses a merged PR. Close only when it
          # is still open; either way, drop the sync branch (the watch
          # recreates it next time upstream moves).
          state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
          if [ "$state" = "OPEN" ]; then
            gh pr close "$PR_NUMBER"
          else
            echo "PR #${PR_NUMBER} is already ${state}; nothing to close."
          fi
          if git ls-remote --exit-code --heads origin upstream-sync >/dev/null; then
            git push origin --delete upstream-sync
          else
            echo "upstream-sync is already gone; nothing to delete."
          fi

      - name: Report a failed promotion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          CLOSE_OUTCOME: ${{ steps.close.outcome }}
        run: |
          set -euo pipefail
          title="[promote-sync] promotion failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          next="${NEXT:-<next tag>}"
          head_sha="${HEAD_SHA:-<sha>}"

          body="$(printf 'Promoting the upstream sync failed. Inspect the run:\n\n%s\n\nStep outcomes:\n- Resolve the sync PR: %s\n- Compute the next release tag: %s\n- Promote upstream-sync to edison: %s\n- Tag and publish the release: %s\n- Close the PR: %s\n\nManual recipe (only run the parts that did not already complete above):\n```bash\ngit fetch origin upstream-sync\ngit push --force-with-lease origin origin/upstream-sync:edison\ngit tag %s %s\ngit push origin %s\n```\n' \
            "$run_url" \
            "${RESOLVE_OUTCOME:-unknown}" "${VERSION_OUTCOME:-unknown}" "${PROMOTE_OUTCOME:-unknown}" "${TAG_OUTCOME:-unknown}" "${CLOSE_OUTCOME:-unknown}" \
            "$next" "$head_sha" "$next")"

          existing="$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
